<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Atamalar Lug'ati</title>
    <!-- CSS faylini ulanishi -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- Sarlavha qismi -->
        <header>
            <h1>IT Atamalar Lug'ati</h1>
            <p>Dasturlash va axborot texnologiyalari bo'yicha zamonaviy lug'at</p>
        </header>

        <!-- Flashcard rejimiga o'tish tugmasi -->
        <div class="mode-toggle">
            <button id="modeToggleBtn" class="mode-btn">🔄 Flashcard Rejimiga O'tish</button>
        </div>

        <!-- Qidiruv qutisi -->
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Atama yoki ma'nosini qidiring...">
        </div>

        <!-- Kategoriyalar bo'yicha filtr tugmalari -->
        <div class="filter-buttons">
            <button class="filter-btn active" data-category="all">Barchasi</button>
            <button class="filter-btn" data-category="frontend">Frontend</button>
            <button class="filter-btn" data-category="backend">Backend</button>
            <button class="filter-btn" data-category="git">Git & Tools</button>
            <button class="filter-btn" data-category="database">Database</button>
            <button class="filter-btn" data-category="general">Umumiy</button>
        </div>

        <!-- Atamalar chiqadigan asosiy konteyner -->
        <div id="termsContainer" class="terms-grid">
            <!-- JavaScript orqali kartochkalar shu yerga dinamik qo'shiladi -->
        </div>
    </div>

    <!-- JavaScript faylini ulanishi -->
    <script src="script.js"></script>
</body>
</html>
