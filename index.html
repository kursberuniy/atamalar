<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Atamalar Lug'ati</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>📚 IT Atamalar Lug'ati</h1>
            <p>Dasturlash olamidagi eng muhim tushunchalar bazasi</p>
        </header>

        <!-- Kategoriyalar bo'yicha filtr tugmalari -->
        <div class="filter-buttons">
            <button class="filter-btn active" data-category="all">Barchasi</button>
            <button class="filter-btn" data-category="frontend">Frontend</button>
            <button class="filter-btn" data-category="backend">Backend</button>
            <button class="filter-btn" data-category="git">Git & Tools</button>
            <button class="filter-btn" data-category="database">Database</button>
            <button class="filter-btn" data-category="general">Umumiy</button>
        </div>

        <!-- Qidiruv qismi -->
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Atamani qidiring (masalan: API, Git)...">
        </div>

        <!-- Atamalar chiqadigan joy -->
        <div class="terms-grid" id="termsContainer">
            <!-- JavaScript orqali elementlar shu yerga qo'shiladi -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
